spring:
  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 10s
    connect-timeout: 5s

  data:
    elasticsearch:
      repositories:
        enabled: true

logging:
  level:
    org.springframework.data.elasticsearch.client.WIRE: TRACE # Para ver as queries no console
    org.springframework.web.reactive.function.client.WebClient: DEBUG # Para ver as chamadas da API

uri_properties:
  baseUrl: https://api.coingecko.com/api/v3
  CoinListUrl: /coins/list
