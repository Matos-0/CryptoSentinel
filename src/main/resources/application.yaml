spring:
  # Configuração do Elasticsearch Reativo
  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 10s
    connect-timeout: 5s

  # Habilitando os Repositórios Reativos
  data:
    elasticsearch:
      repositories:
        enabled: true

# Configurações de Log (Opcional, mas ajuda muito no Dia 1 e 2)
logging:
  level:
    org.springframework.data.elasticsearch.client.WIRE: TRACE # Para ver as queries no console
    org.springframework.web.reactive.function.client.WebClient: DEBUG # Para ver as chamadas da API