version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: always
    environment:
      - POSTGRES_USER=crypto_sentinel
      - POSTGRES_PASSWORD=p0stgr3s
      - POSTGRES_DB=crypto_monitor
    ports:
      - "5432:5432"
    volumes:
      - ts_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

volumes:
  ts_data:

